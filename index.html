<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#143c78">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" href="icon-192.png?v=4">
<title>Courier Companion</title>
<link rel="stylesheet" href="lib/leaflet.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,Roboto,sans-serif;background:#eef1f5;color:#10233f;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%}
header{background:#143c78;color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:15px}
header b{font-size:17px}
#cnt{margin-left:auto;text-align:right;font-size:13px;line-height:1.25}
#net{width:10px;height:10px;border-radius:50%;background:#3c6;display:inline-block}
#net.off{background:#e55}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow:auto}
.view.on{display:block}
#v-map{overflow:hidden}
#map{position:absolute;inset:0;background:#dfe5ec}
nav{display:flex;background:#fff;border-top:1px solid #cfd6e0;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;font-size:12px;color:#51627d;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px;line-height:1}
nav button.on{color:#143c78;font-weight:700}
.btn{border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:600;background:#143c78;color:#fff;min-height:52px}
.btn.sec{background:#e3e9f2;color:#143c78}
.btn.ok{background:#1a9a4a}.btn.no{background:#d63b3b}.btn.warn{background:#e8890c}.btn.gray{background:#8795ab}
.btn.sm{padding:8px 12px;min-height:40px;font-size:14px}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}
#fab{position:absolute;right:10px;bottom:12px;z-index:900;display:flex;flex-direction:column;gap:8px}
#fab .btn{box-shadow:0 2px 8px #0005}
#topbar{position:absolute;left:8px;right:8px;top:8px;z-index:1200;max-height:80%;overflow:auto;display:none;background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 8px #0005}
.pin{width:30px;height:30px;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px #0008;position:relative}
.pin.approx{border-style:dashed;border-color:#ffd54a}.pin.approx.st-c,.pin.approx.st-r{background:#f5a524;color:#1d2433;border:3px dashed #fff}
.pin sup{position:absolute;right:-7px;top:-9px;background:#10233f;color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;font-weight:700}
.st-c{background:#1e6fe0}.st-cd{background:#1a9a4a}.st-cn{background:#d63b3b}
.st-r{background:#e8890c}.st-rd{background:#0b7a75}.st-rn{background:#a4259c}
.st-x{background:#6b778a}
.me{width:18px;height:18px;border-radius:50%;background:#0a84ff;border:3px solid #fff;box-shadow:0 0 0 2px #0a84ff55}
#sheetbg{position:fixed;inset:0;background:#0006;z-index:1000;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:1001;display:none;box-shadow:0 -4px 16px #0006}
#sheet h3{margin:0 0 6px;font-size:18px}
.card{border:1px solid #d6dde8;border-radius:12px;padding:10px;margin:8px 0;background:#fafcff}
.card .t{font-weight:700;font-size:16px}.card .s{color:#51627d;font-size:14px;margin-top:2px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:9px;background:#e3e9f2;color:#143c78;margin-right:4px;font-weight:600}
.tag.cod{background:#ffe3a8;color:#7a4a00}.tag.rit{background:#ffd9b0;color:#8a4400}
.note{background:#fff6cf;border-radius:8px;padding:6px 8px;margin-top:6px;font-size:14px;white-space:pre-wrap}
label{display:block;font-size:13px;color:#51627d;margin:8px 0 2px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid #bcc7d8;border-radius:10px;background:#fff;font-family:inherit}
textarea{min-height:70px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#10233fee;color:#fff;padding:10px 16px;border-radius:20px;z-index:3000;display:none;font-size:14px;max-width:90%;text-align:center}
#banner{position:fixed;left:8px;right:8px;top:54px;background:#fff7d6;border:1px solid #e0b93a;border-radius:12px;padding:10px;z-index:2000;display:none;box-shadow:0 2px 8px #0004}
#busy{position:fixed;inset:0;background:#000a;z-index:4000;display:none;align-items:center;justify-content:center;color:#fff;font-size:18px;text-align:center;padding:30px}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #dde3ec;background:#fff}
.list .it .n{min-width:34px;height:34px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.list .it .drag{font-size:22px;color:#8a97ad;padding:6px 4px 6px 10px;touch-action:none;user-select:none;cursor:grab}.list .it.dragging{background:#e8f0fd;box-shadow:0 2px 10px #0003;position:relative;z-index:5}
.list .it .x{flex:1;min-width:0}.list .it .x b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .x span{font-size:13px;color:#51627d}
.chips{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #dde3ec}
.chips button{border:1px solid #bcc7d8;background:#fff;border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chips button.on{background:#143c78;color:#fff;border-color:#143c78}
.menu{padding:12px;display:flex;flex-direction:column;gap:8px}
.menu small{color:#51627d;display:block;margin:-2px 2px 4px}
#v-scan{background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scanui{position:absolute;left:0;right:0;bottom:0;padding:10px;background:linear-gradient(#0000,#000c);display:flex;flex-direction:column;gap:8px;color:#fff}
#scanmsg{text-align:center;font-size:14px}
#frame{position:absolute;left:12%;right:12%;top:22%;height:34%;border:3px solid #fff8;border-radius:16px}
.legend{font-size:12px;color:#51627d;padding:8px 12px}
.legend span{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 3px 0 8px;vertical-align:-1px}
.leaflet-control-attribution{font-size:9px}
</style>
</head>
<body>
<div id="app">
<header><b>Courier Companion</b><span id="net" title="Rete"></span><div id="cnt">–</div></header>
<main>
  <section class="view on" id="v-map"><div id="map"></div><div id="topbar"></div>
    <div id="fab"><button class="btn sec sm" id="bSat">🛰 Satellite</button><button class="btn sec sm" id="bLoc">◎ Io</button><button class="btn" id="bNext">▶ Prossima</button></div>
  </section>
  <section class="view" id="v-list"></section>
  <section class="view" id="v-scan">
    <video id="cam" playsinline muted></video><div id="frame"></div>
    <div id="scanui"><div id="scanmsg">Inquadra il Data Matrix dell'etichetta</div>
      <div id="scandbg" style="font-size:11px;opacity:.7;text-align:center"></div><div class="row"><button class="btn" id="bShot">📸 Scatta e leggi</button><button class="btn sec" id="bTorch" style="display:none;flex:.35">🔦</button></div><div class="row"><button class="btn sec" id="bFast">Veloce: no</button><button class="btn sec" id="bPhoto">Da galleria</button><button class="btn sec" id="bManual">+ A mano</button></div>
    </div>
    <input type="file" id="fPhoto" accept="image/*" hidden><input type="file" id="fShot" accept="image/*" capture="environment" hidden>
  </section>
  <section class="view" id="v-menu"></section>
</main>
<nav>
  <button data-v="map" class="on"><i>🗺</i>Mappa</button>
  <button data-v="list"><i>☰</i>Lista</button>
  <button data-v="scan"><i>▣</i>Scanner</button>
  <button data-v="add"><i>＋</i>Aggiungi</button>
  <button data-v="menu"><i>⋮</i>Menu</button>
</nav>
</div>
<div id="sheetbg"></div><div id="sheet"></div><div id="toast"></div><div id="busy"></div>
<div id="banner"><b>Vuoi salvare i dati?</b><div class="row"><button class="btn ok sm" id="bkYes">Sì</button><button class="btn sec sm" id="bkLater">Più tardi</button></div></div>
<input type="file" id="fImport" accept=".xlsx,.xls,.csv" hidden>
<script src="lib/leaflet.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/zxing-wasm-reader.js"></script>
<script src="app.js"></script>
</body>
</html>
